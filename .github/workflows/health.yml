name: Availability checks
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
  push:
    branches: [main]
    paths: ['scripts/health-check.mjs', '.github/workflows/health.yml']
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/health-check.mjs
